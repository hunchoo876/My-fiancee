<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Aysha Baby</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;1,9..144,300&family=Figtree:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --plum: #1d1027;
    --dusk: #3b1a45;
    --rose: #ef7f95;
    --peach: #ffb58f;
    --petal: #fdeee6;
    --serif: "Fraunces", Georgia, "Times New Roman", serif;
    --sans: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--plum);
    color: var(--petal);
    font-family: var(--sans);
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }

  /* slow breathing glow behind everything */
  .glow {
    position: fixed; inset: -20%;
    background:
      radial-gradient(40% 35% at 30% 35%, rgba(239,127,149,.32), transparent 70%),
      radial-gradient(45% 40% at 72% 68%, rgba(255,181,143,.22), transparent 70%),
      radial-gradient(60% 60% at 50% 50%, var(--dusk), transparent 80%);
    animation: drift 28s ease-in-out infinite alternate;
    pointer-events: none;
  }
  @keyframes drift {
    from { transform: translate3d(-3%, -2%, 0) scale(1); }
    to   { transform: translate3d(3%, 3%, 0) scale(1.12); }
  }

  .stage {
    position: relative;
    height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 2rem 1.75rem;
    text-align: center;
    cursor: pointer;
  }

  /* intro */
  .intro {
    display: flex; flex-direction: column; align-items: center; gap: 2.25rem;
    transition: opacity .9s ease, transform .9s ease;
  }
  .intro.gone { opacity: 0; transform: translateY(-12px); pointer-events: none; }
  .intro h1 {
    margin: 0;
    font-family: var(--serif);
    font-weight: 300;
    font-style: italic;
    font-variation-settings: "opsz" 144;
    font-size: clamp(3rem, 14vw, 6.5rem);
    line-height: 1;
    letter-spacing: -0.02em;
  }
  .btn {
    font: 500 1rem/1 var(--sans);
    color: var(--plum);
    background: var(--petal);
    border: 0; border-radius: 999px;
    padding: .95rem 2.1rem;
    cursor: pointer;
    transition: transform .2s ease, background .2s ease;
  }
  .btn:hover { background: #fff; transform: translateY(-1px); }
  .btn:focus-visible, .stage:focus-visible { outline: 3px solid var(--peach); outline-offset: 4px; }

  /* the words */
  .scene { display: grid; place-items: center; width: 100%; max-width: 22ch; min-height: 1em; }
  .scene { max-width: min(34rem, 100%); }
  .line {
    grid-area: 1 / 1;
    font-family: var(--serif);
    font-weight: 300;
    font-variation-settings: "opsz" 120;
    font-size: clamp(1.85rem, 6.4vw, 3.4rem);
    line-height: 1.22;
    letter-spacing: -0.012em;
    text-wrap: balance;
    margin: 0;
  }
  .w {
    display: inline-block;
    opacity: 0;
    filter: blur(14px);
    transform: translateY(.4em);
    transition:
      opacity 1.1s ease,
      filter 1.1s ease,
      transform 1.3s cubic-bezier(.2,.7,.2,1);
    transition-delay: calc(var(--i) * 140ms);
  }
  .line.in .w { opacity: 1; filter: blur(0); transform: none; }
  .line.out .w {
    opacity: 0; filter: blur(10px); transform: translateY(-.25em);
    transition-duration: .8s; transition-delay: 0ms;
  }
  .line.big { font-size: clamp(2.3rem, 8.4vw, 4.6rem); font-style: italic; }

  .sign {
    margin-top: 2.25rem;
    font-family: var(--serif);
    font-style: italic;
    font-weight: 300;
    font-size: clamp(1.25rem, 4vw, 1.7rem);
    color: var(--peach);
    opacity: 0; transform: translateY(10px);
    transition: opacity 1.6s ease, transform 1.6s ease;
  }
  .again {
    margin-top: 2.25rem;
    opacity: 0; pointer-events: none;
    background: transparent; color: var(--petal);
    border: 1px solid rgba(253,238,230,.4);
    transition: opacity 1.6s ease .8s, background .2s ease, color .2s ease;
  }
  .again:hover { background: var(--petal); color: var(--plum); }
  .done .sign { opacity: 1; transform: none; }
  .done .again { opacity: 1; pointer-events: auto; }

  .hint {
    position: fixed; left: 0; right: 0;
    bottom: calc(1.6rem + env(safe-area-inset-bottom, 0px));
    text-align: center;
    font-size: .85rem;
    color: rgba(253,238,230,.5);
    opacity: 0; transition: opacity 1.2s ease;
    pointer-events: none;
  }
  .hint.show { opacity: 1; }

  .bar {
    position: fixed; left: 0; bottom: 0; height: 3px; width: 0;
    background: linear-gradient(90deg, var(--rose), var(--peach));
    transition: width 1.2s ease;
  }

  /* hearts, only at the very end */
  .hearts { position: fixed; inset: 0; overflow: hidden; pointer-events: none; }
  .heart {
    position: absolute; bottom: -10vh;
    color: var(--rose);
    opacity: 0;
  }
  .finale .heart { animation: rise var(--d) linear var(--delay) infinite; }
  @keyframes rise {
    0%   { transform: translateY(0) translateX(0); opacity: 0; }
    12%  { opacity: .55; }
    100% { transform: translateY(-115vh) translateX(var(--sway)); opacity: 0; }
  }

  /* static version */
  .static { display: none; }
  .reduced .glow { animation: none; }
  .reduced .stage, .reduced .hint, .reduced .bar, .reduced .hearts { display: none; }
  .reduced body, body.reduced { overflow: auto; }
  .reduced .static {
    display: block; max-width: 34rem; margin: 0 auto; padding: 4rem 1.75rem 5rem;
    position: relative; text-align: center;
  }
  .static p {
    font-family: var(--serif); font-weight: 300;
    font-size: 1.7rem; line-height: 1.3; margin: 0 0 2.5rem;
  }
  .static .sign { opacity: 1; transform: none; }
</style>
</head>
<body>
  <div class="glow" aria-hidden="true"></div>

  <main class="stage" id="stage" tabindex="-1">
    <div class="intro" id="intro">
      <h1>For you</h1>
      <button class="btn" id="open" type="button">Open</button>
    </div>

    <div class="scene" id="scene" aria-live="polite"></div>
    <div class="sign" id="sign"></div>
    <button class="btn again" id="again" type="button">Read it again</button>
  </main>

  <div class="static" id="static"></div>
  <div class="hint" id="hint">Tap anywhere to move on</div>
  <div class="bar" id="bar"></div>
  <div class="hearts" id="hearts" aria-hidden="true"></div>

<script>
  /* ---------- Edit these ---------- */
  const HER = "Aysha baby";    // how you'd greet her: "Hi, Aysha baby."
  const HIS = "Muhammad Galo"; // your name, shown in the sign-off (leave empty to skip)

  const LINES = [
    `Hi, ${HER}.`,
    "I made this page for one reason.",
    "I want you to have my words somewhere they won\u2019t get buried in a chat.",
    "I love how you make an ordinary day feel lighter just by being in it.",
    "I appreciate how you show up for me, even on the days I\u2019m not easy to show up for.",
    "You listen. You care. You make me want to be better.",
    "Thank you for your patience, your laughter, and the quiet ways you look after me.",
    "Loving you, Aysha, is the easiest thing I do.",
    "I don\u2019t say it enough, so here it is.",
    "I love you, baby, and I\u2019m so grateful for you. Every single day."
  ];
  const SIGN_OFF = "Always yours" + (HIS ? ", " + HIS : "");
  /* -------------------------------- */

  const $ = id => document.getElementById(id);
  const stage = $("stage"), intro = $("intro"), scene = $("scene"),
        sign = $("sign"), again = $("again"), hint = $("hint"),
        bar = $("bar"), hearts = $("hearts");

  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  sign.textContent = SIGN_OFF;

  if (reduce) {
    document.body.classList.add("reduced");
    const s = $("static");
    LINES.forEach(t => { const p = document.createElement("p"); p.textContent = t; s.appendChild(p); });
    const g = document.createElement("div"); g.className = "sign"; g.textContent = SIGN_OFF; s.appendChild(g);
  }

  // hearts
  for (let i = 0; i < 16; i++) {
    const h = document.createElement("span");
    h.className = "heart";
    h.textContent = "\u2665";
    h.style.left = (Math.random() * 100) + "%";
    h.style.fontSize = (12 + Math.random() * 20) + "px";
    h.style.setProperty("--d", (9 + Math.random() * 8) + "s");
    h.style.setProperty("--delay", (Math.random() * 8) + "s");
    h.style.setProperty("--sway", ((Math.random() - .5) * 90) + "px");
    hearts.appendChild(h);
  }

  // start fetching the fonts immediately, so they're ready before the first line shows
  const fontsReady = Promise.race([
    Promise.all([
      document.fonts.load('300 1em "Fraunces"'),
      document.fonts.load('italic 300 1em "Fraunces"')
    ]),
    new Promise(r => setTimeout(r, 4000))
  ]).catch(() => {});

  let index = -1, timer = null, started = false, finished = false;

  function build(text, isLast) {
    const p = document.createElement("p");
    p.className = "line" + (isLast ? " big" : "");
    const words = text.split(" ");
    words.forEach((w, i) => {
      const s = document.createElement("span");
      s.className = "w";
      s.style.setProperty("--i", i);
      s.textContent = w;
      p.appendChild(s);
      if (i < words.length - 1) p.appendChild(document.createTextNode(" "));
    });
    return p;
  }

  function holdFor(text) {
    const n = text.split(" ").length;
    return n * 140 + 1100 + n * 230 + 900;
  }

  function next() {
    clearTimeout(timer);
    if (finished) return;

    const prev = scene.querySelector(".line:not(.out)");
    if (prev) {
      prev.classList.add("out");
      setTimeout(() => prev.remove(), 900);
    }

    index++;
    const text = LINES[index];
    const isLast = index === LINES.length - 1;
    const el = build(text, isLast);
    scene.appendChild(el);
    void el.offsetWidth;                 // commit the starting state
    requestAnimationFrame(() => el.classList.add("in"));

    bar.style.width = ((index + 1) / LINES.length * 100) + "%";
    if (index === 1) hint.classList.add("show");

    if (isLast) {
      finished = true;
      hint.classList.remove("show");
      const settle = text.split(" ").length * 140 + 1800;
      setTimeout(() => {
        stage.classList.add("done");
        document.body.classList.add("finale");
      }, settle);
    } else {
      timer = setTimeout(next, holdFor(text));
    }
  }

  function begin() {
    if (started) return;
    started = true;
    intro.classList.add("gone");
    Promise.all([fontsReady, new Promise(r => setTimeout(r, 800))])
      .then(() => { intro.style.display = "none"; next(); });
  }

  function restart() {
    clearTimeout(timer);
    stage.classList.remove("done");
    document.body.classList.remove("finale");
    scene.innerHTML = "";
    bar.style.width = "0";
    index = -1; finished = false;
    setTimeout(next, 500);
  }

  $("open").addEventListener("click", e => { e.stopPropagation(); begin(); });
  again.addEventListener("click", e => { e.stopPropagation(); restart(); });

  stage.addEventListener("click", () => {
    if (started && !finished) next();
  });
  document.addEventListener("keydown", e => {
    if (!started || finished) return;
    if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); next(); }
  });
</script>
</body>
</html>
